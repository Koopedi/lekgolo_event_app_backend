# Set the dialect explicitly so startup doesn't depend on a live connection.
# (Use org.hibernate.dialect.MariaDBDialect instead if the server is MariaDB.)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Table already exists, so never let Hibernate alter it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Keep connection pool small for a shared remote DB
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
